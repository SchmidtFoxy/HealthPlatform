    <style>
      /* Abertura animada do PWA: HTML puro para aparecer no primeiro quadro, antes do JS carregar.
         Comeca igual a splash nativa (simbolo no centro sobre o mesmo fundo do manifest/icone maskable)
         e continua dali: o simbolo sobe e cresce, linhas de luz passam pelo contorno e o nome entra letra a letra.
         Sempre escura, porque a splash do sistema (background_color) nao acompanha o tema. */
      #abertura {
        --ab-bg: 5 16 14; --ab-fg: 230 243 240; --ab-muted: 140 168 162;
        --ab-a1: 94 240 200; --ab-traco: 170 255 230; --ab-halo: 15 90 80;
        --ab-k: .7; --ab-dy: 60px;
        position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden;
        background: rgb(var(--ab-bg)); color: rgb(var(--ab-fg));
        transition: opacity .55s cubic-bezier(.4,0,.2,1), transform .7s cubic-bezier(.4,0,.2,1), filter .55s ease;
      }
      #abertura.sair { opacity: 0; transform: scale(1.06); filter: blur(8px); pointer-events: none; }
      #abertura .ab-halo { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0; animation: ab-in 1.4s ease .3s forwards, ab-respira 6s ease-in-out 1.7s infinite alternate; }
      #abertura .ab-h1 { width: 70vmax; height: 70vmax; left: -32vmax; top: -38vmax; background: rgb(var(--ab-a1) / .12); }
      #abertura .ab-h2 { width: 70vmax; height: 70vmax; right: -34vmax; bottom: -38vmax; background: rgb(var(--ab-halo) / .5); animation-delay: .5s, 1.9s; }
      #abertura .ab-grade { position: absolute; inset: 0; opacity: 0; animation: ab-in 1.8s ease .5s forwards;
        background: radial-gradient(rgb(var(--ab-fg) / .06) 1px, transparent 1px); background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(45% 35% at 50% 45%, black, transparent); mask-image: radial-gradient(45% 35% at 50% 45%, black, transparent); }
      #abertura .ab-centro { position: relative; display: flex; flex-direction: column; align-items: center; transform: translateY(-3vh); }
      #abertura svg { width: min(86vw, 360px); height: auto; overflow: visible; margin: -40px 0 -46px;
        transform: translateY(var(--ab-dy)) scale(var(--ab-k)); animation: ab-abre 1.15s cubic-bezier(.65,0,.2,1) .15s forwards; }
      #abertura .ab-orbita { fill: none; stroke: rgb(var(--ab-a1) / .22); stroke-width: 1.5; stroke-dasharray: 1; stroke-dashoffset: 1; animation: ab-traco 1.6s cubic-bezier(.6,0,.2,1) .7s forwards; }
      #abertura .ab-ponto { fill: rgb(var(--ab-a1)); opacity: 0; animation: ab-pisca 2.4s ease-in-out 1.4s infinite; }
      #abertura .ab-luz { fill: none; stroke: rgb(var(--ab-traco)); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1;
        filter: drop-shadow(0 0 6px rgb(var(--ab-a1) / .9)); animation: ab-traco 1s cubic-bezier(.65,0,.25,1) .55s forwards, ab-some .7s ease 1.6s forwards; }
      #abertura .ab-l2 { animation-delay: .7s, 1.65s; } #abertura .ab-l3 { animation-delay: .8s, 1.7s; } #abertura .ab-l4 { animation-delay: .9s, 1.75s; }
      #abertura .ab-simbolo { -webkit-mask: url(#ab-mascara); mask: url(#ab-mascara); }
      #abertura .ab-reflexo { opacity: 0; animation: ab-reflexo 1.3s cubic-bezier(.5,0,.3,1) 1.5s forwards, ab-reflexo 1.3s cubic-bezier(.5,0,.3,1) 4.2s infinite; }
      #abertura .ab-chao { width: 170px; height: 2px; border-radius: 2px; transform: scaleX(0); opacity: .9;
        background: linear-gradient(90deg, transparent, rgb(var(--ab-a1)), transparent); animation: ab-chao 1s cubic-bezier(.2,.7,.2,1) 1.2s forwards; }
      #abertura .ab-nome { display: flex; margin-top: 26px; padding-left: .42em; font: 300 28px/1 'Sora Variable', Sora, system-ui, sans-serif; letter-spacing: .42em; }
      #abertura .ab-nome span { opacity: 0; transform: translateY(10px); filter: blur(6px); animation: ab-letra .75s cubic-bezier(.2,.7,.2,1) forwards; }
      #abertura .ab-nome span:nth-child(1) { animation-delay: 1.25s; } #abertura .ab-nome span:nth-child(2) { animation-delay: 1.32s; }
      #abertura .ab-nome span:nth-child(3) { animation-delay: 1.39s; } #abertura .ab-nome span:nth-child(4) { animation-delay: 1.46s; }
      #abertura .ab-nome span:nth-child(5) { animation-delay: 1.53s; }
      #abertura .ab-lema { margin-top: 14px; font: 600 10px/1 'Figtree Variable', Figtree, system-ui, sans-serif; letter-spacing: .32em; text-transform: uppercase; color: rgb(var(--ab-muted)); opacity: 0; animation: ab-in .9s ease 1.75s forwards; }
      @keyframes ab-in { to { opacity: 1; } }
      @keyframes ab-some { to { opacity: 0; } }
      @keyframes ab-abre { to { transform: none; } }
      @keyframes ab-respira { from { transform: scale(1); } to { transform: scale(1.12) translate(2%, 3%); } }
      @keyframes ab-traco { to { stroke-dashoffset: 0; } }
      @keyframes ab-reflexo { 0% { opacity: 0; transform: translateX(-420px); } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(420px); } }
      @keyframes ab-pisca { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
      @keyframes ab-chao { to { transform: scaleX(1); } }
      @keyframes ab-letra { to { opacity: 1; transform: none; filter: blur(0); } }
      @media (prefers-reduced-motion: reduce) {
        #abertura * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
        #abertura .ab-luz, #abertura .ab-reflexo { display: none; }
      }

    <script>
      // So no app instalado (ou com ?abertura para ver no navegador), uma vez por sessao.
      // O React chama __aesynAbertura.pronto() ao montar; a animacao fica no ar pelo menos MIN ms.
      (function () {
        var el = document.getElementById('abertura');
        var MIN = 2700, MAX = 7000, t0 = Date.now(), feito = false;
        var forcar = /[?&]abertura\b/.test(location.search);
        var app = forcar || (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
        var jaViu = false;
        try { jaViu = sessionStorage.getItem('aesyn-abertura') === '1'; sessionStorage.setItem('aesyn-abertura', '1'); } catch (e) {}
        function fechar() {
          if (feito) return;
          feito = true;
          el.classList.add('sair');
          setTimeout(function () { el.remove(); }, 750);
        }
        if (!app || (jaViu && !forcar)) { el.remove(); window.__aesynAbertura = { pronto: function () {} }; return; }
        // Primeiro quadro no mesmo lugar e tamanho do icone da splash do sistema (240dp no centro da tela).
        var svg = el.querySelector('svg');
        svg.style.transform = 'none';
        var r = svg.getBoundingClientRect();
        svg.style.transform = '';
        if (r.width) {
          el.style.setProperty('--ab-k', String(Math.min(1, 240 / r.width)));
          el.style.setProperty('--ab-dy', innerHeight / 2 - (r.top + r.height / 2) + 'px');
        }
        window.__aesynAbertura = {
          pronto: function () {
            if (/[?&]abertura=fixa\b/.test(location.search)) return;
            setTimeout(fechar, Math.max(0, MIN - (Date.now() - t0)));
          },
        };
        if (!/[?&]abertura=fixa\b/.test(location.search)) setTimeout(fechar, MAX);
      })();
    </script>
