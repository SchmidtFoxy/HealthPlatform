    <script>
      // So no app instalado (ou com ?abertura para ver no navegador), uma vez por sessao.
      // O React chama __aesynAbertura.pronto() ao montar; a animacao fica no ar pelo menos MIN ms.
      (function () {
        var el = document.getElementById('abertura');
        var MIN = 2700, MAX = 7000, t0 = Date.now(), feito = false;
        var forcar = /[?&]abertura\b/.test(location.search);
        var app = forcar || (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
        var jaViu = false;
        try { jaViu = sessionStorage.getItem('aesyn-abertura') === '1'; sessionStorage.setItem('aesyn-abertura', '1'); } catch (e) {}
        function fechar() {
          if (feito) return;
          feito = true;
          el.classList.add('sair');
          setTimeout(function () { el.remove(); }, 750);
        }
        if (!app || (jaViu && !forcar)) { el.remove(); window.__aesynAbertura = { pronto: function () {} }; return; }
        window.__aesynAbertura = {
          pronto: function () {
            if (/[?&]abertura=fixa\b/.test(location.search)) return;
            setTimeout(fechar, Math.max(0, MIN - (Date.now() - t0)));
          },
        };
        if (!/[?&]abertura=fixa\b/.test(location.search)) setTimeout(fechar, MAX);
      })();
    </script>
