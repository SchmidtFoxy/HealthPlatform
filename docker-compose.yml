name: healthplatform

services:
  postgres:
    image: postgres:18-alpine
    container_name: healthplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthplatform
      POSTGRES_USER: healthplatform
      POSTGRES_PASSWORD: healthplatform_dev
    ports:
      - "5432:5432"
    volumes:
      - healthplatform_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthplatform -d healthplatform"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  healthplatform_pgdata:
